<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ライブ指標</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
      background: #111416;
      color: #f6f7f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; background: #111416; }
    main { padding: 14px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0; }
    .state { display: flex; align-items: center; gap: 6px; color: #aeb6ba; font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #70787d; }
    .dot.live { background: #f04646; box-shadow: 0 0 0 3px rgba(240, 70, 70, 0.18); }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric { border: 1px solid #30363a; border-radius: 6px; padding: 12px; background: #191d20; }
    .label { color: #aeb6ba; font-size: 12px; margin-bottom: 4px; }
    .value { font-size: 34px; line-height: 1.05; font-weight: 700; font-variant-numeric: tabular-nums; }
    footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; color: #899297; font-size: 11px; }
    .error { color: #ffb454; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ライブ指標</h1>
      <div class="state"><span id="dot" class="dot"></span><span id="part">接続中</span></div>
    </header>
    <section class="metrics">
      <div class="metric"><div class="label">同時視聴</div><div id="concurrent" class="value">--</div></div>
      <div class="metric"><div class="label">視聴回数</div><div id="views" class="value">--</div></div>
    </section>
    <footer><span id="updated">未更新</span><span id="error" class="error"></span></footer>
  </main>
  <script>
    const number = new Intl.NumberFormat("ja-JP");
    const show = (value) => value === null || value === undefined ? "--" : number.format(Number(value));
    async function refresh() {
      try {
        const response = await fetch(`/api/stats?t=${Date.now()}`, { cache: "no-store" });
        const data = await response.json();
        document.getElementById("concurrent").textContent = show(data.concurrentViewers);
        document.getElementById("views").textContent = show(data.viewCount);
        document.getElementById("part").textContent = data.part ? data.part.replace("part", "第") + "部" : data.status;
        document.getElementById("dot").classList.toggle("live", data.status === "live");
        document.getElementById("updated").textContent = data.updatedAt ? `更新 ${new Date(data.updatedAt).toLocaleTimeString("ja-JP")}` : "未更新";
        document.getElementById("error").textContent = data.error || "";
      } catch (error) {
        document.getElementById("error").textContent = "接続エラー";
      }
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
